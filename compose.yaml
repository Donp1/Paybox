services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: bountydesk
      POSTGRES_PASSWORD: bountydesk
      POSTGRES_DB: bountydesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bountydesk -d bountydesk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
